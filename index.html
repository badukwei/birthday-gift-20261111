<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6ed" />
    <meta name="description" content="給小壽星的五個小回憶，和 Quokka 一起打開生日驚喜。" />
    <title>生日快樂，我的小壽星 ♡</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="./content.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="topbar"><span class="brand">a little us<span class="brand-dot">✳</span></span><span class="edition">JUST FOR YOU</span></header>
      <section class="intro" aria-labelledby="title">
        <p class="eyebrow">A LITTLE BIRTHDAY SURPRISE</p>
        <h1 id="title">給妳的<span>生日驚喜</span></h1>
        <p class="subtitle">五個小回憶，送給今天最特別的妳。</p>
      </section>
      <nav class="progress" aria-label="回憶進度"><span class="progress-line"></span></nav>
      <section class="scene" aria-label="Quokka 和妳的對話">
        <span class="spark spark-one" aria-hidden="true">✧</span><span class="spark spark-two" aria-hidden="true">♡</span>
        <span class="hello" aria-hidden="true">psst… 小壽星！</span>
        <img class="quokka" src="./assets/quokka-0.webp" width="500" height="500" alt="穿著紅衣服的 DINOTAENG Quokka" />
        <span class="ground" aria-hidden="true"></span>
      </section>
      <section id="interaction" class="interaction" aria-label="回憶問答"></section>
      <footer><span>made with a little love</span><span aria-hidden="true">♡</span></footer>
    </main>
  </body>
</html>
